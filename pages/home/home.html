<p>Vizzy is a data visualization app. Upload a <code>.csv</code> or <code>.xlsx</code> to get started.</p>
<p>Vizzy uses <a target="_blank">AdminLTE</a> and <a target="_blank">Web Components</a> for the layout.</p>
<p>The <a target="_blank">IndexedDB API</a> for storage.</p>
<p><a target="_blank">DataTables</a> for data rendering.</p>
<p>And <a target="_blank">Danfo.js</a> for data manipulation.</p>
